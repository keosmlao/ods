name: odss_tech
description: "ODIEN Service — ແອັບຊ່າງ (ຮັບງານ · ຂັ້ນຕອນ · check-in · ລາຍຮັບ)"
publish_to: "none"
version: 1.14.0+36

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # ຕິດຕໍ່ /api/mobile/* ຂອງ ODSS
  http: ^1.2.2
  # token ເກັບໃນບ່ອນປອດໄພຂອງລະບົບ (Keychain / Keystore) ບໍ່ແມ່ນ SharedPreferences
  flutter_secure_storage: ^9.2.2
  # ຮູບຜົນງານ · ຮູບ QC · ຮູບ check-in
  image_picker: ^1.1.2
  # ບ່ອນເກັບ "ຮ່າງ" (ຮູບທີ່ຖ່າຍແລ້ວ ຍັງບໍ່ໄດ້ສົ່ງ) — ບໍ່ໃຫ້ຫາຍຕອນອອກຈາກໜ້າຈໍ/ແອັບຖືກຂ້າ
  path_provider: ^2.1.5
  # ພິກັດ check-in (ຫຼັກຖານວ່າຊ່າງໄປຮອດໜ້າງານຈິງ)
  geolocator: ^13.0.2
  # ສະແກນ ISN/SN ດ້ວຍກ້ອງ (ງານຕິດຕັ້ງ) — ຊ່າງບໍ່ຕ້ອງພິມເລກຍາວໆ ແລະ ບໍ່ພິມຜິດ
  mobile_scanner: ^7.4.0
  # ກົດໂທຫາລູກຄ້າ
  url_launcher: ^6.3.1

  # ── ແຈ້ງເຕືອນ (FCM) ──
  # ໃຊ້ໄດ້ຕໍ່ເມື່ອແລ່ນ `flutterfire configure` ແລ້ວ (ເບິ່ງ README).
  # ຖ້າຍັງບໍ່ຕັ້ງຄ່າ ແອັບຍັງແລ່ນປົກກະຕິ — ພຽງແຕ່ບໍ່ໄດ້ຮັບແຈ້ງເຕືອນ (main.dart ຈັບ error ໄວ້).
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^20.1.0
  # ── Dashboard ຫົວໜ້າ: chart (ວຽກຕໍ່ຂັ້ນ) ──
  fl_chart: ^0.69.0
  # ແຜນທີ່ງານຄ້າງ (ຜູ້ຈັດການ) — OSM tiles, ບໍ່ຕ້ອງມີ API key ຄື Google Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  package_info_plus: ^8.1.0
  open_filex: ^4.7.0
  permission_handler: ^11.3.1
  firebase_crashlytics: ^4.3.10
  flutter_image_compress: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Noto Sans Lao (variable font, OFL) — bundle ໃຫ້ render ຄືກັນທຸກເຄື່ອງ.
  # family ກົງກັບ ThemeData.fontFamily; Flutter map fontWeight → wght axis ໃຫ້ເອງ.
  fonts:
    - family: Noto Sans Lao
      fonts:
        - asset: assets/fonts/NotoSansLao.ttf
